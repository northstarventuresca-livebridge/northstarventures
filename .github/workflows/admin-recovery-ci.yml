name: Admin Email Recovery Checks
on:
  push:
    branches:
      - feature/admin-email-password-recovery-20261029
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker.js
      - run: node --check admin-reset.js
      - run: npm test
