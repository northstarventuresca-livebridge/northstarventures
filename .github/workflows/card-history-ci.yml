name: Northstar Card History CI
on:
  push:
    branches: [feature/customer-provision-and-card-logs-20261029]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check worker.js
      - run: node --check card-access.js
      - run: node --check card-audit.js
      - run: node --check card-audit-ui.js
      - run: npm test
