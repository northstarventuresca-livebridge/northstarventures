name: North Star isolated diagnostics
on:
  pull_request:
    paths:
      - 'diagnostics/**'
      - 'tests/diagnostics.test.mjs'
      - '.github/workflows/diagnostics-ci.yml'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to check'
        required: true
        type: choice
        options:
          - northstar-command-center
          - home-of-hope
          - livebridge
          - x32-ai-engineer
      level:
        description: 'Test level'
        required: true
        type: choice
        options:
          - change
          - full
permissions:
  contents: read
jobs:
  test-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/diagnostics.test.mjs
  smoke-checks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only isolated tests
        run: node diagnostics/runner.mjs --project "${{ inputs.project }}" --level "${{ inputs.level }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "diagnostics-${{ inputs.project }}-${{ github.run_id }}"
          path: diagnostics-results/
          retention-days: 14
          if-no-files-found: warn
