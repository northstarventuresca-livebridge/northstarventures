name: North Star isolated diagnostics
on:
  pull_request:
    paths:
      - 'diagnostics/**'
      - 'tests/diagnostics.test.mjs'
      - 'tests/browser-diagnostics.test.mjs'
      - '.github/workflows/diagnostics-ci.yml'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to check'
        required: true
        type: choice
        options:
          - northstar-command-center
          - home-of-hope
          - livebridge
          - x32-ai-engineer
      level:
        description: 'Test level'
        required: true
        type: choice
        options:
          - change
          - full
permissions:
  contents: read
jobs:
  test-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/diagnostics.test.mjs tests/browser-diagnostics.test.mjs
  smoke-checks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test-runner
    env:
      TEST_PROJECT: ${{ inputs.project }}
      TEST_LEVEL: ${{ inputs.level }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only HTTP tests
        run: node diagnostics/runner.mjs --project "$TEST_PROJECT" --level "$TEST_LEVEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "http-diagnostics-${{ inputs.project }}-${{ github.run_id }}"
          path: diagnostics-results/
          retention-days: 14
          if-no-files-found: warn
  browser-checks:
    runs-on: ubuntu-latest
    needs: test-runner
    env:
      TEST_PROJECT: ${{ github.event_name == 'workflow_dispatch' && inputs.project || 'northstar-command-center' }}
      TEST_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.level || 'change' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Run isolated browser diagnostics
        run: node diagnostics/browser-runner.mjs --project "$TEST_PROJECT" --level "$TEST_LEVEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "browser-diagnostics-${{ github.run_id }}"
          path: diagnostics-results/
          retention-days: 14
          if-no-files-found: warn
