name: LiveBridge isolated password-only login test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/livebridge-staging-login.yml'
      - 'tests/browser-livebridge-staging-login.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  livebridge-login:
    name: LiveBridge staging browser login
    runs-on: ubuntu-latest
    env:
      NSV_LB_STAGING_LOGIN_URL: ${{ vars.NSV_LB_STAGING_LOGIN_URL }}
      NSV_LB_TEST_EMAIL: ${{ secrets.NSV_LB_TEST_EMAIL }}
      NSV_LB_TEST_PASSWORD: ${{ secrets.NSV_LB_TEST_PASSWORD }}
      NSV_LB_DEDICATED_TEST_ACCOUNT: ${{ vars.NSV_LB_DEDICATED_TEST_ACCOUNT == 'true' || vars.NSV_LB_DEDICATED_TEST_ACCOUNT == 'True' }}
    steps:
      - name: Check dedicated staging configuration
        id: configuration
        shell: bash
        run: |
          if [[ -n "$NSV_LB_STAGING_LOGIN_URL" && -n "$NSV_LB_TEST_EMAIL" && -n "$NSV_LB_TEST_PASSWORD" && "$NSV_LB_DEDICATED_TEST_ACCOUNT" == "true" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "NOT RUN — one or more required settings are missing:" | tee -a "$GITHUB_STEP_SUMMARY"
            [[ -n "$NSV_LB_STAGING_LOGIN_URL" ]] || echo "- NSV_LB_STAGING_LOGIN_URL (GitHub Actions variable)" | tee -a "$GITHUB_STEP_SUMMARY"
            [[ -n "$NSV_LB_TEST_EMAIL" ]] || echo "- NSV_LB_TEST_EMAIL (GitHub Actions secret)" | tee -a "$GITHUB_STEP_SUMMARY"
            [[ -n "$NSV_LB_TEST_PASSWORD" ]] || echo "- NSV_LB_TEST_PASSWORD (GitHub Actions secret)" | tee -a "$GITHUB_STEP_SUMMARY"
            [[ "$NSV_LB_DEDICATED_TEST_ACCOUNT" == "true" ]] || echo "- NSV_LB_DEDICATED_TEST_ACCOUNT must equal true (GitHub Actions variable)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.configuration.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.configuration.outputs.configured == 'true'
        with: { node-version: '22' }
      - name: Install isolated browser runner
        if: steps.configuration.outputs.configured == 'true'
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Test password to dashboard, no email code
        if: steps.configuration.outputs.configured == 'true'
        run: node tests/browser-livebridge-staging-login.mjs
      - name: Upload safe status report
        if: always() && steps.configuration.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: livebridge-password-login-report
          path: livebridge-staging-login-result.json
          if-no-files-found: ignore
          retention-days: 14
