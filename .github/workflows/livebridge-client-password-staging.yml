name: LiveBridge existing client password login staging
on:
  push:
    branches: [main]
    paths:
      - 'tests/browser-livebridge-existing-client-staging.mjs'
      - '.github/workflows/livebridge-client-password-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Staging account password and setup prompt
    runs-on: ubuntu-latest
    env:
      NSV_LB_TEST_EMAIL: ${{ secrets.NSV_LB_TEST_EMAIL }}
      NSV_LB_TEST_PASSWORD: ${{ secrets.NSV_LB_TEST_PASSWORD }}
      NSV_LB_DEDICATED_TEST_ACCOUNT: ${{ vars.NSV_LB_DEDICATED_TEST_ACCOUNT == 'true' || vars.NSV_LB_DEDICATED_TEST_ACCOUNT == 'True' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --check tests/browser-livebridge-existing-client-staging.mjs
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - run: node tests/browser-livebridge-existing-client-staging.mjs
