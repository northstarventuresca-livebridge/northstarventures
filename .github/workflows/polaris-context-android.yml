name: Polaris Android GPS Collector Build
on:
  push:
    branches: [feature/polaris-context-collector-android]
    paths:
      - "polaris-context-android/**"
      - ".github/workflows/polaris-context-android.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preserve beta APK signing key across updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: polaris-context-beta-signing-key-v1
      - name: Assemble signed debug APK
        working-directory: polaris-context-android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Check APK and app package
        run: |
          test -s polaris-context-android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging polaris-context-android/app/build/outputs/apk/debug/app-debug.apk | head -4
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose polaris-context-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish signed beta APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp polaris-context-android/app/build/outputs/apk/debug/app-debug.apk /tmp/Polaris-Context-GPS-v1-beta2.apk
          gh release create polaris-context-gps-v1-beta2 /tmp/Polaris-Context-GPS-v1-beta2.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Polaris Context GPS (Beta)" \
            --notes "Background GPS and device context recorder for Polaris. Installs alongside the existing Polaris voice app. Pair from Polaris > Memory before starting." \
            --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: Polaris-Context-GPS-v1
          path: polaris-context-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
