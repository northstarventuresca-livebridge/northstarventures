name: Northstar Access Card CI
on:
  push:
    branches: ["feature/northstar-card-access-20261029"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker.js
      - run: node --check card-access.js
      - run: npm test
