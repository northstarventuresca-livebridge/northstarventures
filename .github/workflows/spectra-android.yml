name: Spectra Android test APK
on:
  push:
    branches:
      - feature/fieldlink-android-background-gps-20261112
    paths:
      - "spectra-fieldlink/android/**"
      - ".github/workflows/spectra-android.yml"
  workflow_dispatch:

permissions:
  contents: write

# Only publish the latest tested native build to the stable, public download URL.
concurrency:
  group: spectra-fieldlink-android-beta
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Spectra
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 35
        run: |
          echo "SDK: $ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
          test -n "$SDKMGR"
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test adaptive tracking rules
        run: gradle -p spectra-fieldlink/android :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile debug APK
        run: gradle -p spectra-fieldlink/android :app:assembleDebug --no-daemon --stacktrace
      - name: Publish installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spectra-FieldLink-Android-debug
          path: spectra-fieldlink/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish stable public Android download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="spectra-fieldlink-android-beta"
          FILE="spectra-fieldlink/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$FILE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Spectra FieldLink Android Beta" \
              --notes "Android-only Spectra FieldLink test build. GPS tracking works while Android permits the location service to run. This is an unsigned-for-release debug beta, not an emergency locator." \
              --prerelease
          fi
          cp "$FILE" "/tmp/Spectra-FieldLink.apk"
          gh release upload "$TAG" "/tmp/Spectra-FieldLink.apk" --clobber
          gh release delete-asset "$TAG" "app-debug.apk" --yes 2>/dev/null || true
          echo "Public Spectra APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/Spectra-FieldLink.apk"
