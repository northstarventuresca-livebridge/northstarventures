name: North Star / Home of Hope SSO staging
on:
  push:
    branches: [feature/command-center-hoh-sso-20261101]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check worker.js
      - run: node --check home-of-hope-sso.js
      - run: node --check projects-hub-ui.js
      - run: node --check integrations/home-of-hope/hoh-sso-worker-addon.js
      - run: npm test
