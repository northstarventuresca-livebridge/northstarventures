<!doctype html>
<html lang="en-CA">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#061c2b">
<title>Polaris • Voice Call</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#051927;color:#e7f9ff}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 15%,#13506a 0,#09283d 48%,#061827 95%);display:grid;place-items:center}
main{max-width:500px;width:100%;padding:28px 22px;text-align:center}
.icon{display:grid;place-items:center;background:#155e73;border:2px solid #63cece;width:98px;height:98px;border-radius:50%;font-size:48px;margin:0 auto 22px;box-shadow:0 0 50px #3ccaba30}
h1{font-size:30px;letter-spacing:.04em;margin:6px 0}.sub{color:#b3d5e3;margin:9px 0 28px}
#status{min-height:58px;color:#b1e8da;font-size:15px}
#transcript{border:1px solid #477487;background:#062338;border-radius:14px;padding:16px;min-height:112px;text-align:left;line-height:1.45;max-height:36vh;overflow:auto;word-wrap:break-word;margin-bottom:20px}
.role{font-size:12px;color:#73d6d1;margin-top:5px;font-weight:700}
p{margin:5px 0 12px}button{font:inherit;padding:14px 21px;border-radius:14px;border:1px solid #77c7db;background:#154a66;color:white;font-weight:700}
button.primary{background:#64e0be;border:0;color:#052b39}button.hang{background:#af434e;border:0}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:11px}button:disabled{opacity:.38}
.small{font-size:12px;color:#b2ccda;margin-top:25px}
</style></head><body>
<main>
<div class="icon">✦</div>
<h1>POLARIS</h1>
<p class="sub">Private, two-way voice conversation</p>
<p id="status" aria-live="polite">Connecting to your phone…</p>
<div id="transcript" aria-live="polite"><p>Ready when you are.</p></div>
<div class="controls">
<button id="start" class="primary" disabled>Answer / Start</button>
<button id="mute" disabled>Mute</button>
<button id="end" class="hang">End call</button>
</div>
<p class="small">Polaris uses the OpenAI Realtime API. Tap End call to disconnect the microphone. The custom voice assistant shares selected Polaris project knowledge, not your private ChatGPT app session.</p>
<audio id="speaker" autoplay playsinline></audio>
</main>
<script>
"use strict";
(()=>{
let token="",peer=null,dc=null,microphone=null,connected=false,muted=false,starting=false,callClosed=false;
const $=id=>document.getElementById(id);
function status(s){$("status").textContent=s}
function transcript(role,text){
 if(!text)return;
 const line=document.createElement("p");
 const roleNode=document.createElement("span");roleNode.className="role";roleNode.textContent=role;
 const desc=document.createElement("span");desc.textContent=" "+String(text).slice(0,2500);
 line.append(roleNode,desc);$("transcript").append(line);$("transcript").scrollTop=$("transcript").scrollHeight;
}
async function post(path,data){
 const r=await fetch(path,{method:"POST",cache:"no-store",headers:{"content-type":"application/json","authorization":"Bearer "+token},body:JSON.stringify(data)});
 const body=await r.json();if(!r.ok||!body.ok)throw Error(body.error||"Polaris request failed");
 return body;
}
async function onRealtimeEvent(event){
 if(event.type==="error"){const msg=event.error?.message||"Voice connection reported an error";status(msg.slice(0,200));return}
 if(event.type==="conversation.item.input_audio_transcription.completed"){transcript("You",event.transcript);return}
 if(event.type==="response.output_audio_transcript.done"){transcript("Polaris",event.transcript);return}
 if(event.type==="response.done"){
  for(const part of event.response?.output||[]){
   if(part.type!=="function_call")continue;
   if(part.name==="schedule_callback"){
    let minutes=5;try{minutes=Number(JSON.parse(part.arguments||"{}").minutes)}catch{}
    minutes=Math.max(1,Math.min(60,Math.round(minutes||5)));
    window.location.href="polarisvoice://callback?minutes="+minutes;
    if(dc?.readyState==="open"){
     dc.send(JSON.stringify({type:"conversation.item.create",item:{type:"function_call_output",call_id:part.call_id,output:"Android companion scheduled a local callback invitation in "+minutes+" minutes. The user can end this conversation now."}}));
     dc.send(JSON.stringify({type:"response.create"}));
    }
    transcript("System","Callback requested for "+minutes+" minutes from now.");
    continue;
   }
   if(part.name!=="ask_polaris")continue;
   let question="";
   try{question=JSON.parse(part.arguments||"{}").question||""}catch{}
   status("Checking Polaris project and memory…");
   let answer;
   try{const d=await post("/api/companion/voice/ask",{question});answer=d.reply||"I couldn't find an answer."}
   catch(e){answer="I couldn't reach Polaris's records: "+e.message}
   if(!dc||dc.readyState!=="open")return;
   dc.send(JSON.stringify({type:"conversation.item.create",item:{type:"function_call_output",call_id:part.call_id,output:answer}}));
   dc.send(JSON.stringify({type:"response.create"}));
   status("Connected • listening");
  }
 }
}
async function start(){
 if(!token||starting||connected||callClosed)return;
 starting=true;$("start").disabled=true;status("Opening microphone…");
 try{
  try {
   microphone=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  } catch(firstError) {
   if(firstError?.name!=="NotReadableError" && firstError?.name!=="OverconstrainedError")throw firstError;
   status("Retrying microphone with basic audio settings…");
   await new Promise(resolve=>setTimeout(resolve,300));
   try{microphone=await navigator.mediaDevices.getUserMedia({audio:true})}
   catch(retryError){
    const detail=(retryError?.name||firstError?.name||"Unknown error");
    throw new Error("Android microphone unavailable ("+detail+"). Check microphone permission and close other recording apps.");
   }
  }
  peer=new RTCPeerConnection();
  peer.ontrack=e=>{
   $("speaker").srcObject=e.streams[0];
   $("speaker").play().catch(()=>{status("Tap Answer to enable speaker audio.")});
  };
  peer.onconnectionstatechange=()=>{if(peer&&["failed","disconnected"].includes(peer.connectionState))status("Audio connection interrupted. End and retry if needed.")};
  for(const track of microphone.getTracks())peer.addTrack(track,microphone);
  dc=peer.createDataChannel("oai-events");
  dc.onmessage=e=>{try{onRealtimeEvent(JSON.parse(e.data))}catch(err){status("Voice event error: "+err.message)}};
  dc.onopen=()=>{
   connected=true;status("Connected • listening");$("mute").disabled=false;
   dc.send(JSON.stringify({type:"response.create",response:{instructions:"Greet the person who just answered briefly, then invite them to speak normally. Keep the opening to one sentence."}}));
  };
  const offer=await peer.createOffer();await peer.setLocalDescription(offer);
  status("Connecting to Polaris voice…");
  const secret=await post("/api/companion/voice/session",{});
  const response=await fetch("https://api.openai.com/v1/realtime/calls",{method:"POST",
   headers:{"Authorization":"Bearer "+secret.value,"Content-Type":"application/sdp"},body:offer.sdp});
  if(!response.ok)throw Error("OpenAI voice call HTTP "+response.status);
  await peer.setRemoteDescription({type:"answer",sdp:await response.text()});
 }catch(err){status("Could not start: "+err.message);stop(false);$("start").disabled=false}
 finally{starting=false}
}
function stop(finished=true){
 if(dc){try{dc.close()}catch{}dc=null}
 if(peer){try{peer.close()}catch{}peer=null}
 if(microphone){microphone.getTracks().forEach(t=>t.stop());microphone=null}
 $("speaker").srcObject=null;connected=false;muted=false;$("mute").disabled=true;$("mute").textContent="Mute";
 if(finished){callClosed=true;status("Call ended.");$("start").disabled=true;}
}
$("start").onclick=()=>start();
$("mute").onclick=()=>{if(!microphone)return;muted=!muted;microphone.getAudioTracks().forEach(t=>t.enabled=!muted);$("mute").textContent=muted?"Unmute":"Mute";status(muted?"Microphone muted":"Connected • listening")};
$("end").onclick=()=>{stop();transcript("System","Call ended. You can return to Polaris Companion.")};
window.addEventListener("pagehide",()=>stop());
window.PolarisPhone={
 setDeviceToken(value){
  if(typeof value!=="string"||!/^[0-9a-f]{64}$/i.test(value))return status("Pair the Polaris phone app first.");
  token=value;callClosed=false;$("start").disabled=false;status("Ready to connect.");
  start();
 },
 hangUp:()=>stop()
};
})();
</script>
</body></html>
