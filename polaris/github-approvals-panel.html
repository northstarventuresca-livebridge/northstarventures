<style>
#polarisApprovalMount{position:fixed;right:17px;bottom:18px;z-index:2147483600;font:14px/1.4 system-ui,sans-serif;color:#e8faff}
#polarisApprovalToggle{border-radius:40px;border:1px solid #6edbe9;background:#082f4b;color:#e8faff;box-shadow:0 6px 35px #0009;padding:12px 18px;cursor:pointer;font-weight:760;letter-spacing:.01em}
#polarisApprovalToggle em{display:inline-block;font:700 13px system-ui;background:#fcbe73;color:#12263a;border-radius:50%;min-width:22px;padding:2px 5px;margin-left:7px}
#polarisApprovalPanel{display:none;position:absolute;right:0;bottom:54px;width:min(420px,calc(100vw - 34px));max-height:min(75vh,660px);overflow:auto;background:#071c2e;border-radius:17px;border:1px solid #4eb8db;box-shadow:0 15px 55px #000b;padding:15px}
#polarisApprovalPanel.open{display:block}
#polarisApprovalPanel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;border:0!important;padding:0!important}
#polarisApprovalPanel h3{margin:0;font-size:17px}
#polarisApprovalPanel .paClose{font-size:19px;cursor:pointer;border:0;background:transparent;color:#c7e9ff}
#polarisApprovalItems article{background:#0e2b41;border:1px solid #2c637d;padding:12px;border-radius:11px;margin:11px 0}
#polarisApprovalItems strong{display:block;font-size:14px}
#polarisApprovalItems p{margin:7px 0;color:#c2dae7;line-height:1.4;font-size:13px;white-space:pre-wrap}
#polarisApprovalItems small{color:#94b3c8;font-size:11px}
#polarisApprovalItems .paActions{display:flex;gap:8px;margin-top:9px}
#polarisApprovalItems button{cursor:pointer;background:#08786f;border:1px solid #4ce6c6;color:white;border-radius:8px;padding:9px 12px;font:700 12px system-ui}
#polarisApprovalItems button.paReject{background:#273c50;border-color:#687f9a}
#polarisApprovalPanel>a{color:#80daef;font-size:12px}
</style>
<div id="polarisApprovalMount"><div id="polarisApprovalPanel" role="region" aria-label="Polaris website changes" aria-live="polite">
<header><h3>Website Change Requests</h3><button class="paClose" type="button" aria-label="Close requests">×</button></header>
<p style="color:#92b8c9;font-size:12px">Approve to prepare a draft for review. Nothing goes live without a separate approval.</p>
<div id="polarisApprovalItems"></div><a href="/changes">Open full change history</a>
</div><button id="polarisApprovalToggle" type="button" aria-expanded="false">✦ Website requests <em id="polarisApprovalCount" hidden>0</em></button></div>
<script>(function(){'use strict';
const toggle=document.getElementById('polarisApprovalToggle'),panel=document.getElementById('polarisApprovalPanel'),items=document.getElementById('polarisApprovalItems'),count=document.getElementById('polarisApprovalCount');let busy=false,known=-1;
toggle.addEventListener('click',()=>{const open=panel.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));if(open)load()});
panel.querySelector('.paClose').onclick=()=>{panel.classList.remove('open');toggle.setAttribute('aria-expanded','false')};
async function load(){if(busy)return;busy=true;
 try{const r=await fetch('/api/github-app/changes',{cache:'no-store',credentials:'same-origin'});if(!r.ok)return;const d=await r.json();const pending=(d.items||[]).filter(x=>x.status==='requested');count.hidden=!pending.length;count.textContent=String(pending.length);
 if(known!==pending.length){known=pending.length;if(pending.length)toggle.title=pending.length+' requests awaiting approval'}
 if(!panel.classList.contains('open'))return;
 items.replaceChildren();if(!pending.length){items.textContent='No requests are waiting for approval.';return}
 for(const item of pending){const card=document.createElement('article'),head=document.createElement('strong'),info=document.createElement('small'),desc=document.createElement('p'),actions=document.createElement('div');
 head.textContent=item.project;info.textContent=(item.repository||'Repository unassigned')+' · '+new Date(item.requested_at).toLocaleString();desc.textContent=item.request_text;actions.className='paActions';
 const approve=document.createElement('button'),reject=document.createElement('button');approve.textContent='Approve for draft';reject.textContent='Reject';reject.className='paReject';
 const send=async decision=>{const msg=decision==='approve'?'Approve preparation of a draft for '+item.project+'? This does NOT deploy the change.':'Reject this request?';if(!confirm(msg))return;
 approve.disabled=reject.disabled=true;
 try{const r=await fetch('/api/github-app/changes/decision',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-polaris-action':'1'},body:JSON.stringify({id:item.id,decision})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Approval could not be saved');await load()}
 catch(e){alert(e.message);approve.disabled=reject.disabled=false}
 };
 approve.onclick=()=>send('approve');reject.onclick=()=>send('reject');
 actions.append(approve,reject);card.append(head,info,desc,actions);items.append(card)
 }
 }catch(e){if(panel.classList.contains('open'))items.textContent='Unable to refresh requests.'}
 finally{busy=false}
}
load();setInterval(()=>{if(!document.hidden)load()},6500);
})();</script>
